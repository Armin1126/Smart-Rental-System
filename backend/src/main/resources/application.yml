server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-rental-backend

  # PostgreSQL as default datasource
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_rental_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# OpenAPI documentation config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# H2 fallback profile activated via SPRING_PROFILES_ACTIVE=h2
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:smartrentaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
